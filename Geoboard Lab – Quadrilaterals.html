<!doctype html><html lang="en"><head><meta charset="utf-8">

<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--card:#1f242e;--ink:#e8eaf0;--mut:#9aa3b2;--acc:#ff8a4c;--line:#333a48;--peg:#5a6273;--fill:rgba(255,138,76,.2);--ok:#69db7c;--no:#ff8787}}
:root[data-theme="dark"]{--bg:#15181f;--card:#1f242e;--ink:#e8eaf0;--mut:#9aa3b2;--acc:#ff8a4c;--line:#333a48;--peg:#5a6273;--fill:rgba(255,138,76,.2);--ok:#69db7c;--no:#ff8787}
*{box-sizing:border-box}
:root[data-theme="neon"]{--bg:#070914;--card:#0d1226;--ink:#e6f1ff;--mut:#8da2c8;--acc:#ff2bd6;--line:#27305e;--peg:#33448a;--fill:rgba(255,43,214,.16);--ok:#00f5d4;--no:#ff4d6d}
[data-theme="neon"] body{background:radial-gradient(1100px 600px at 15% -10%,#1b1458 0,transparent 60%),radial-gradient(900px 500px at 100% 5%,#073a4d 0,transparent 55%),#070914;background-attachment:fixed}
[data-theme="neon"] .c{border-color:#2b3a8a;background:linear-gradient(180deg,#131b3b,#0b1022);box-shadow:0 12px 28px rgba(0,0,0,.55),0 0 22px rgba(255,43,214,.12),inset 0 1px 0 rgba(255,255,255,.08)}
[data-theme="neon"] svg{border-color:#2b3a8a;background:radial-gradient(circle at 50% 40%,#111b40,#080c1d);box-shadow:inset 0 0 50px rgba(0,245,212,.08),0 16px 40px rgba(0,0,0,.6),0 0 32px rgba(120,60,255,.28)}

[data-theme="neon"] h1,[data-theme="neon"] .nm{text-shadow:0 0 14px currentColor}

[data-theme="neon"] #poly{filter:drop-shadow(0 0 7px #ff2bd6) drop-shadow(0 10px 8px rgba(0,0,0,.65))}
[data-theme="neon"] svg circle[data-i]{filter:drop-shadow(0 0 7px #ff2bd6) drop-shadow(0 5px 3px rgba(0,0,0,.7))}
[data-theme="neon"] svg line{filter:drop-shadow(0 0 7px #00f5d4)}

.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap}html,body{height:auto}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:14px}

</style></head><body><div class="w">
<div class="hd"><h1>📐 Geoboard Lab</h1><div class="row"><button id="th0">Classic</button><button id="th1">⚡ Neon</button></div></div>
<p class="sub">Drag the corners (pegs snap to whole numbers). In a locked mode the shape <b>keeps its rules</b> while you stretch it. Drag the body to move it.</p>
<div class="row" id="modes"></div>
<div class="g"><div><svg id="b"></svg>
<div class="row" id="tg"></div></div>
<div id="ctl"></div><div id="info"></div></div></div>
<script>
const $=s=>document.querySelector(s);
const N=14,M=10,S=40,P=30,W=N*S+2*P,H=M*S+2*P;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const D2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
const CR=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
const DT=(o,a,b)=>(a[0]-o[0])*(b[0]-o[0])+(a[1]-o[1])*(b[1]-o[1]);
const PAR=(a,b,c,d)=>(b[0]-a[0])*(d[1]-c[1])-(b[1]-a[1])*(d[0]-c[0])===0;
const f=x=>+x.toFixed(2);
const L=d=>{const r=Math.sqrt(d);return Number.isInteger(r)?''+r:'√'+d+' ≈ '+f(r)};
const Ls=d=>{const r=Math.sqrt(d);return Number.isInteger(r)?''+r:'√'+d};
const sl=(a,b)=>{let dx=b[0]-a[0],dy=b[1]-a[1];if(!dx)return'∞';let g=gcd(dx,dy),n=dy/g,d=dx/g;if(d<0){n=-n;d=-d}return d==1?''+n:n+'/'+d};
const rectFrom=(i,o,p)=>{const r=[0,0,0,0];r[i]=p;r[(i+2)%4]=o;
 if(i%2==0){r[(i+1)%4]=[o[0],p[1]];r[(i+3)%4]=[p[0],o[1]]}else{r[(i+1)%4]=[p[0],o[1]];r[(i+3)%4]=[o[0],p[1]]}return r};
const modes={
 free:{n:'Free',v:[[3,3],[10,2],[11,8],[5,7]],t:'No constraints. Move any corner and watch the shape change its name.',d:(i,p)=>V.map((v,k)=>k==i?p:v)},
 rect:{n:'Rectangle',v:[[3,7],[9,7],[9,3],[3,3]],t:'Rule: four 90° angles. Dragging a corner slides its two neighbours along the sides so every angle stays 90°.',d:(i,p)=>rectFrom(i,V[(i+2)%4],p)},
 square:{n:'Square',v:[[4,7],[8,7],[8,3],[4,3]],t:'Rule: 4 equal sides + 4 right angles. The square resizes about the opposite corner.',d:(i,p)=>{const o=V[(i+2)%4],dx=p[0]-o[0],dy=p[1]-o[1],s=Math.max(Math.abs(dx),Math.abs(dy));return rectFrom(i,o,[o[0]+(dx<0?-s:s),o[1]+(dy<0?-s:s)])}},
 para:{n:'Parallelogram',v:[[3,3],[6,7],[11,7],[8,3]],t:'Rule: opposite sides parallel. Moving one corner moves the opposite one too so that A + C = B + D (diagonals keep bisecting each other).',d:(i,p)=>{const r=V.slice(),a=V[(i+1)%4],c=V[(i+3)%4];r[i]=p;r[(i+2)%4]=[a[0]+c[0]-p[0],a[1]+c[1]-p[1]];return r}},
 rhomb:{n:'Rhombus',v:[[7,8],[11,5],[7,2],[3,5]],t:'Rule: diagonals bisect each other at 90°. Dragging a vertex changes the half-length of one diagonal; all 4 sides stay equal.',d:(i,p)=>{const cx=V[0][0],cy=V[1][1],a=i%2?Math.abs(p[0]-cx):V[1][0]-cx,b=i%2?V[0][1]-cy:Math.abs(p[1]-cy);return[[cx,cy+b],[cx+a,cy],[cx,cy-b],[cx-a,cy]]}},
 kite:{n:'Kite',v:[[6,9],[9,6],[6,1],[3,6]],t:'Rule: a vertical axis of symmetry. Top/bottom vertices set the axis; side vertices stay mirror images.',d:(i,p)=>{let x=V[0][0],w=V[1][0]-x,yT=V[0][1],yM=V[1][1],yB=V[2][1];
  if(i==0){x=p[0];yT=p[1]}else if(i==2){x=p[0];yB=p[1]}else{yM=p[1];w=i==1?p[0]-x:x-p[0]}
  return[[x,yT],[x+w,yM],[x,yB],[x-w,yM]]}},
 trap:{n:'Isosceles trapezoid',v:[[5,7],[9,7],[11,3],[3,3]],t:'Rule: top ∥ bottom and equal legs (mirror symmetry). Drag a corner to change width or height; the legs stay equal.',d:(i,p)=>{const cx=(V[0][0]+V[1][0])/2;let a=(V[1][0]-V[0][0])/2,b=(V[2][0]-V[3][0])/2,yT=V[0][1],yB=V[2][1];
  if(i<2)yT=p[1];else yB=p[1];
  if(i==0)a=cx-p[0];if(i==1)a=p[0]-cx;if(i==2)b=p[0]-cx;if(i==3)b=cx-p[0];
  return[[cx-a,yT],[cx+a,yT],[cx+b,yB],[cx-b,yB]]}}
};
modes.thm={n:'△ Triangle theorems',v:[[2,2],[12,2],[5,9]],t:'Triangle lab: drag A, B or C anywhere. D and E sit on AB and AC at the same fraction t. Slide t, or press Dance, and watch what never changes.',d:(i,p)=>V.map((v,k)=>k==i?p:v)};
let t=.5,dz=0;
const T={len:1,ang:1,tick:1,right:1,diag:0,med:0};
const TN={len:'Side lengths',ang:'Angles',tick:'Equal-side ticks',right:'Right-angle marks',diag:'Diagonals',med:'All 3 midsegments'};
let mode='free',V=modes.free.v.map(v=>v.slice()),drag=null,ch=0;
const chal=[
 ['Build a parallelogram that is NOT a rectangle or rhombus',p=>p.par&&!p.rect&&!p.rhom],
 ['Build a trapezoid (exactly one parallel pair) with area 12',p=>p.trap&&p.area==12],
 ['Build a kite that is NOT a rhombus',p=>p.kite&&p.convex&&!p.rhom],
 ['Build a rhombus with area 10',p=>p.rhom&&p.area==10],
 ['Build a convex quadrilateral with exactly 4 interior pegs (Pick)',p=>p.convex&&p.I==4],
 ['Build a rectangle with perimeter 20 and area 24',p=>p.rect&&p.perim==20&&p.area==24]
];
function an(V){
 const[A,B,C,Dd]=V,s=[D2(A,B),D2(B,C),D2(C,Dd),D2(Dd,A)];
 let a2=0;V.forEach((v,i)=>{const w=V[(i+1)%4];a2+=v[0]*w[1]-w[0]*v[1]});
 const turn=V.map((v,i)=>CR(V[(i+3)%4],v,V[(i+1)%4]));
 const convex=turn.every(t=>t*a2>0);
 const x=(p1,p2,p3,p4)=>CR(p1,p2,p3)*CR(p1,p2,p4)<0&&CR(p3,p4,p1)*CR(p3,p4,p2)<0;
 const simple=!(x(A,B,C,Dd)||x(B,C,Dd,A));
 const p01=PAR(A,B,C,Dd),p12=PAR(B,C,Dd,A),par=p01&&p12;
 const right=V.map((v,i)=>DT(v,V[(i+3)%4],V[(i+1)%4])===0);
 const rect=par&&right[0],rhom=par&&s[0]===s[1],square=rect&&rhom;
 const trap=p01!==p12,isoT=trap&&(p01?s[1]===s[3]:s[0]===s[2]);
 const kite=(s[0]===s[3]&&s[1]===s[2])||(s[0]===s[1]&&s[2]===s[3]);
 const AC=[Dd.length&&C[0]-A[0],C[1]-A[1]],BD=[Dd[0]-B[0],Dd[1]-B[1]];
 const diagBis=A[0]+C[0]===B[0]+Dd[0]&&A[1]+C[1]===B[1]+Dd[1];
 const diagPerp=AC[0]*BD[0]+AC[1]*BD[1]===0,diagEq=D2(A,C)===D2(B,Dd);
 const ang=V.map((v,i)=>{const u=V[(i+3)%4],w=V[(i+1)%4];let a=Math.acos(DT(v,u,w)/Math.sqrt(D2(v,u)*D2(v,w)))*180/Math.PI;if(turn[i]*a2<0)a=360-a;return a});
 const area=Math.abs(a2)/2;let Bd=0;V.forEach((v,i)=>{const w=V[(i+1)%4];Bd+=gcd(w[0]-v[0],w[1]-v[1])});
 const name=!simple?'Self-intersecting (not a simple quadrilateral)':!convex?'Concave quadrilateral':square?'Square':rect?'Rectangle':rhom?'Rhombus':par?'Parallelogram':isoT?'Isosceles trapezoid':trap&&right.some(q=>q)?'Right trapezoid':trap?'Trapezoid':kite?'Kite':'General quadrilateral';
 return{s,a2,area,convex,simple,p01,p12,par,right,rect,rhom,square,trap,isoT,kite,diagBis,diagPerp,diagEq,ang,Bd,I:area-Bd/2+1,name,perim:s.reduce((q,r)=>q+Math.sqrt(r),0),AC:D2(A,C),BD:D2(B,Dd)}
}
function valid(nv){
 if(nv.some(v=>v[0]<0||v[0]>N||v[1]<0||v[1]>M||!Number.isFinite(v[0])))return false;
 const p=an(nv);if(p.a2===0)return false;
 if(mode!=='free'&&!p.convex)return false;return true}
const px=x=>P+x*S,py=y=>P+(M-y)*S,svg=$('#b');
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
function pt(e){const r=svg.getBoundingClientRect();return[Math.round(((e.clientX-r.left)/r.width*W-P)/S),Math.round(M-((e.clientY-r.top)/r.height*H-P)/S)]}
svg.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-i]');
 if(t)drag={i:+t.dataset.i};else if(e.target.closest('#poly'))drag={s:pt(e),b:V};e.preventDefault()});
addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);let nv;
 if(drag.s){const dx=p[0]-drag.s[0],dy=p[1]-drag.s[1];nv=drag.b.map(v=>[v[0]+dx,v[1]+dy])}else nv=modes[mode].d(drag.i,p);
 if(mode==='thm'){if(nv.every(v=>v[0]>=0&&v[0]<=N&&v[1]>=0&&v[1]<=M)&&CR(nv[0],nv[1],nv[2])){V=nv;draw()}return}if(valid(nv)){V=nv;draw()}});
addEventListener('pointerup',()=>drag=null);
const unit=(a,b)=>{const d=Math.hypot(b[0]-a[0],b[1]-a[1])||1;return[(b[0]-a[0])/d,(b[1]-a[1])/d]};
function draw(){if(mode==='thm')return drawT();
 const p=an(V),q=V.map(v=>[px(v[0]),py(v[1])]),cen=[q.reduce((a,v)=>a+v[0],0)/4,q.reduce((a,v)=>a+v[1],0)/4];
 let h='';
 for(let x=0;x<=N;x++)for(let y=0;y<=M;y++)h+=`<circle cx="${px(x)}" cy="${py(y)}" r="3" fill="var(--peg)"/>`;
 for(let x=0;x<=N;x++)h+=`<text x="${px(x)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${x}</text>`;
 for(let y=0;y<=M;y++)h+=`<text x="10" y="${py(y)+3}" font-size="10" text-anchor="middle" fill="var(--mut)">${y}</text>`;
 h+=`<polygon id="poly" points="${q.map(v=>v.join(',')).join(' ')}" fill="var(--fill)" stroke="var(--acc)" stroke-width="4" stroke-linejoin="round" style="cursor:move"/>`;
 if(T.diag){h+=`<path d="M${q[0]}L${q[2]}M${q[1]}L${q[3]}" stroke="var(--ink)" stroke-dasharray="6 5" stroke-width="1.5" fill="none"/>`;
  const[A,B,C,Dd]=q,d1=[C[0]-A[0],C[1]-A[1]],d2=[Dd[0]-B[0],Dd[1]-B[1]],den=d1[0]*d2[1]-d1[1]*d2[0];
  if(den){const t=((B[0]-A[0])*d2[1]-(B[1]-A[1])*d2[0])/den;h+=`<circle cx="${A[0]+t*d1[0]}" cy="${A[1]+t*d1[1]}" r="4" fill="var(--ink)"/>`}}
 const lab=(x,y,t,c)=>`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="600" fill="${c||'var(--ink)'}" stroke="var(--card)" stroke-width="4" paint-order="stroke">${t}</text>`;
 const gr=[];p.s.forEach((s,i)=>{let g=gr.findIndex(a=>a.s===s);if(g<0){gr.push({s,n:0,c:[]});g=gr.length-1}gr[g].c.push(i)});
 q.forEach((a,i)=>{const b=q[(i+1)%4],m=[(a[0]+b[0])/2,(a[1]+b[1])/2],u=unit(a,b),n=[-u[1],u[0]],o=unit(cen,m);
  if(T.len)h+=lab(m[0]+o[0]*17,m[1]+o[1]*17,Ls(p.s[i]),'var(--acc)');
  if(T.tick){const g=gr.findIndex(z=>z.s===p.s[i]);if(gr[g].c.length>1){const k=g+1;for(let j=0;j<k;j++){const off=(j-(k-1)/2)*6;h+=`<path d="M${m[0]+u[0]*off-n[0]*7},${m[1]+u[1]*off-n[1]*7}L${m[0]+u[0]*off+n[0]*7},${m[1]+u[1]*off+n[1]*7}" stroke="var(--ink)" stroke-width="2"/>`}}}
 });
 q.forEach((v,i)=>{const pr=q[(i+3)%4],nx=q[(i+1)%4];
  if(T.right&&p.right[i]){const u1=unit(v,pr),u2=unit(v,nx);h+=`<path d="M${v[0]+u1[0]*13},${v[1]+u1[1]*13}l${u2[0]*13},${u2[1]*13}l${-u1[0]*13},${-u1[1]*13}" fill="none" stroke="var(--ink)" stroke-width="1.8"/>`}
  if(T.ang&&!p.right[i]){const c=unit(v,cen);h+=lab(v[0]+c[0]*30,v[1]+c[1]*30,f(p.ang[i])+'°','var(--mut)')}
  else if(T.ang){const c=unit(v,cen);h+=lab(v[0]+c[0]*30,v[1]+c[1]*30,'90°','var(--mut)')}
 });
 q.forEach((v,i)=>{const o=unit(cen,v);
  h+=`<circle data-i="${i}" cx="${v[0]}" cy="${v[1]}" r="11" fill="var(--acc)" stroke="var(--card)" stroke-width="3" style="cursor:grab"/>`;
  h+=`<text x="${v[0]}" y="${v[1]+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" pointer-events="none">${'ABCD'[i]}</text>`;
  h+=lab(v[0]+o[0]*28,v[1]+o[1]*28-6,`(${V[i][0]}, ${V[i][1]})`,'var(--mut)')});
 svg.innerHTML=h;info(p)}
function info(p){
 const ok=b=>b?'<span class="ok">✓</span>':'<span class="no">✗</span>',s=p.s,E=n=>Math.sqrt(n);
 const[A,B,C,Dd]=V;let fm;
 if(!p.convex)fm='Shoelace: A = ½|Σ(xᵢyᵢ₊₁ − xᵢ₊₁yᵢ)|';
 else if(p.square)fm=`s² = ${f(E(s[0]))}² = ${f(p.area)}`;
 else if(p.rect)fm=`length × width = ${f(E(s[0]))} × ${f(E(s[1]))}`;
 else if(p.rhom||(p.kite&&p.diagPerp))fm=`½ × d₁ × d₂ = ½ × ${f(E(p.AC))} × ${f(E(p.BD))}`;
 else if(p.par)fm=`base × height = ${f(E(s[0]))} × ${f(p.area/E(s[0]))}`;
 else if(p.trap){const a=E(p.p01?s[0]:s[1]),b=E(p.p01?s[2]:s[3]);fm=`½(a + b) × h = ½(${f(a)} + ${f(b)}) × ${f(2*p.area/(a+b))}`}
 else fm='Split into two triangles, or use the shoelace formula';
 const fam=[['Trapezoid (≥1 parallel pair)',p.p01||p.p12],['Parallelogram',p.par],['Kite',p.kite&&p.convex],['Rhombus',p.rhom],['Rectangle',p.rect],['Square',p.square]];
 const chk=[['Opposite sides parallel (equal slopes)',p.par],['Exactly one pair of parallel sides',p.trap],['Opposite sides equal',s[0]===s[2]&&s[1]===s[3]],['All four sides equal',s.every(z=>z===s[0])],
  ['Two pairs of adjacent equal sides',p.kite],['All angles 90°',p.right.every(z=>z)],['Opposite angles equal',Math.abs(p.ang[0]-p.ang[2])<1e-9&&Math.abs(p.ang[1]-p.ang[3])<1e-9],
  ['Diagonals bisect each other',p.diagBis],['Diagonals equal',p.diagEq],['Diagonals perpendicular',p.diagPerp]];
 const done=chal[ch][1](p);
 $('#info').innerHTML=`<div class="c"><div class="nm">${p.name}</div><div>${fam.map(a=>`<span class="f ${a[1]?'y':''}">${a[0]}</span>`).join('')}</div>
 <p class="small">${modes[mode].t}</p></div>
 <div class="c"><h3>Properties (live)</h3>${chk.map(a=>`<div>${ok(a[1])} ${a[0]}</div>`).join('')}</div>
 <div class="c"><h3>Coordinate geometry</h3><table><tr><th>Side</th><th>Length (distance formula)</th><th>Slope</th></tr>
 ${[0,1,2,3].map(i=>`<tr><td>${'ABCD'[i]}${'BCDA'[i]}</td><td>${L(s[i])}</td><td>${sl(V[i],V[(i+1)%4])}</td></tr>`).join('')}
 <tr><td>AC</td><td>${L(p.AC)}</td><td>${sl(A,C)}</td></tr><tr><td>BD</td><td>${L(p.BD)}</td><td>${sl(B,Dd)}</td></tr></table>
 <p class="small">Parallel ⇔ equal slopes · Perpendicular ⇔ slopes multiply to −1 · Perimeter = ${f(p.perim)}</p></div>
 <div class="c"><h3>Area</h3><div>Area = <b>${f(p.area)}</b> sq. units</div><div class="small">Formula: <code>${fm}</code></div>
 <div class="small">Shoelace: <code>½|${p.a2}| = ${f(p.area)}</code></div>
 ${p.simple?`<div class="small">Pick's theorem: <code>A = I + B/2 − 1</code> → boundary pegs B = ${p.Bd}, interior I = ${f(p.I)}</div>`:''}</div>
 <div class="c"><h3>Challenge ${ch+1}/${chal.length}</h3><div>${chal[ch][0]}</div><div style="margin:6px 0">${done?'<b class="ok">✓ Solved! Nice.</b>':'<span class="small">Try it in Free mode (or any mode that allows it).</span>'}</div><button id="nx">Next challenge →</button></div>`;
 $('#nx').onclick=()=>{ch=(ch+1)%chal.length;draw()}}
function drawT(){
 const[A,B,C]=V,Q=z=>[px(z[0]),py(z[1])],q=V.map(Q),mix=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
 const Dp=mix(A,B,t),Ep=mix(A,C,t),qd=Q(Dp),qe=Q(Ep),mid=Math.abs(t-.5)<.005,cen=[(q[0][0]+q[1][0]+q[2][0])/3,(q[0][1]+q[1][1]+q[2][1])/3];
 const lab=(x,y,s,c)=>`<text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="600" fill="${c||'var(--ink)'}" stroke="var(--card)" stroke-width="4" paint-order="stroke">${s}</text>`;
 const hy=Math.hypot,ds=(a,b)=>hy(a[0]-b[0],a[1]-b[1]),an3=(a,b,c)=>Math.acos(DT(b,a,c)/Math.sqrt(D2(b,a)*D2(b,c)))*180/Math.PI;
 const AD=ds(A,Dp),DB=ds(Dp,B),AE=ds(A,Ep),EC=ds(Ep,C),DE=ds(Dp,Ep),BC=ds(B,C),AB=ds(A,B),CA=ds(C,A);
 let h='';
 for(let x=0;x<=N;x++)for(let y=0;y<=M;y++)h+=`<circle cx="${px(x)}" cy="${py(y)}" r="3" fill="var(--peg)"/>`;
 for(let x=0;x<=N;x++)h+=`<text x="${px(x)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${x}</text>`;
 for(let y=0;y<=M;y++)h+=`<text x="10" y="${py(y)+3}" font-size="10" text-anchor="middle" fill="var(--mut)">${y}</text>`;
 h+=`<polygon id="poly" points="${q.join(' ')}" fill="var(--fill)" stroke="var(--acc)" stroke-width="4" stroke-linejoin="round" style="cursor:move"/>`;
 h+=`<polygon points="${[qd,qe,q[0]].join(' ')}" fill="var(--ok)" opacity=".18" pointer-events="none"/>`;
 if(T.med){const m=[mix(A,B,.5),mix(B,C,.5),mix(C,A,.5)].map(Q);h+=`<polygon points="${m.join(' ')}" fill="none" stroke="var(--ok)" stroke-dasharray="6 5" stroke-width="2.5" pointer-events="none"/>`+m.map(z=>`<circle cx="${z[0]}" cy="${z[1]}" r="4" fill="var(--ok)"/>`).join('')}
 h+=`<line x1="${qd[0]}" y1="${qd[1]}" x2="${qe[0]}" y2="${qe[1]}" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" pointer-events="none"/>`;
 [[qd,'D'],[qe,'E']].forEach(([z,n])=>h+=`<circle cx="${z[0]}" cy="${z[1]}" r="7" fill="var(--ok)" stroke="var(--card)" stroke-width="2"/>`+lab(z[0]+(n=='D'?-16:16),z[1],n,'var(--ok)'));
 if(T.len){h+=lab((qd[0]+qe[0])/2,(qd[1]+qe[1])/2-14,'DE = '+f(DE),'var(--ok)');h+=lab((q[1][0]+q[2][0])/2,(q[1][1]+q[2][1])/2+(q[1][1]<q[2][1]?-14:14)+4,'BC = '+f(BC),'var(--acc)')}
 q.forEach((v,i)=>{const o=(()=>{const d=hy(v[0]-cen[0],v[1]-cen[1])||1;return[(v[0]-cen[0])/d,(v[1]-cen[1])/d]})();
  h+=`<circle data-i="${i}" cx="${v[0]}" cy="${v[1]}" r="11" fill="var(--acc)" stroke="var(--card)" stroke-width="3" style="cursor:grab"/><text x="${v[0]}" y="${v[1]+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" pointer-events="none">${'ABC'[i]}</text>`;
  h+=lab(v[0]+o[0]*28,v[1]+o[1]*28-6,`(${V[i][0]}, ${V[i][1]})`,'var(--mut)');
  if(T.ang)h+=lab(v[0]-o[0]*30,v[1]-o[1]*30,f(an3(V[(i+2)%3],V[i],V[(i+1)%3]))+'°','var(--mut)')});
 svg.innerHTML=h;
 const s=[D2(A,B),D2(B,C),D2(C,A)],sd=s.slice().sort((a,b)=>a-b),dots=[DT(A,B,C),DT(B,C,A),DT(C,A,B)];
 const kind=(s[0]==s[1]&&s[1]==s[2]?'Equilateral':s[0]==s[1]||s[1]==s[2]||s[0]==s[2]?'Isosceles':'Scalene')+' · '+(dots.some(d=>d===0)?'Right':dots.some(d=>d<0)?'Obtuse':'Acute');
 const sg=(a,b)=>a[0]===b[0]?'∞':f((b[1]-a[1])/(b[0]-a[0])),area=Math.abs(CR(A,B,C))/2,ok='<span class="ok">✓</span>';
 $('#info').innerHTML=`<div class="c"><div class="nm">${mid?'Midpoint Theorem':'Thales / Basic Proportionality'}</div>
 <p>${mid?'The segment joining the midpoints of two sides is <b>parallel</b> to the third side and <b>half</b> its length.':'A line drawn parallel to one side of a triangle divides the other two sides in the <b>same ratio</b>.'}</p>
 <p class="small">${modes.thm.t}</p></div>
 <div class="c"><h3>Watch the numbers</h3>
 <div>${ok} AD : DB = ${f(AD)} : ${f(DB)} = <b>${f(AD/DB)}</b></div>
 <div>${ok} AE : EC = ${f(AE)} : ${f(EC)} = <b>${f(AE/EC)}</b></div>
 <div>${ok} Slope DE = ${sg(Dp,Ep)}, slope BC = ${sg(B,C)} (parallel)</div>
 <div>${ok} ∠ADE = ${f(an3(A,Dp,Ep))}° = ∠ABC = ${f(an3(A,B,C))}° (corresponding angles)</div>
 <div>${ok} DE ÷ BC = ${f(DE)} ÷ ${f(BC)} = <b>${f(DE/BC)}</b> = t ${mid?'= ½ → <b>DE = ½ BC</b>':''}</div>
 <p class="small"><b>Why:</b> △ADE ~ △ABC (shared ∠A + corresponding angles, AA). So every length shrinks by t. Area of △ADE = t² × area of △ABC = ${f(t*t)} × ${f(area)} = ${f(t*t*area)}.</p>
 ${T.med?'<p class="small"><b>All three midsegments</b> cut the triangle into 4 congruent triangles; the medial triangle has ¼ the area = '+f(area/4)+'.</p>':''}</div>
 <div class="c"><h3>The triangle itself</h3><div><b>${kind}</b> · area ${f(area)} · perimeter ${f(AB+BC+CA)}</div>
 <div class="small">AB = ${L(s[0])}, BC = ${L(s[1])}, CA = ${L(s[2])}</div>
 <div class="small">Angle sum: ${f(an3(B,A,C)+an3(A,B,C)+an3(A,C,B))}° (always 180°)</div>
 <div class="small">Pythagoras check: a² + b² ${sd[0]+sd[1]===sd[2]?'=':'≠'} c² → ${sd[0]} + ${sd[1]} ${sd[0]+sd[1]===sd[2]?'=':'≠'} ${sd[2]} ${sd[0]+sd[1]===sd[2]?ok:''}</div></div>`}
function bar(){$('#modes').innerHTML=Object.entries(modes).map(([k,m])=>`<button data-m="${k}" class="${k===mode?'on':''}">${m.n}</button>`).join('')+'<button id="rs">↺ Reset</button>';
 $('#modes').onclick=e=>{const k=e.target.dataset.m;if(e.target.id=='rs'){V=modes[mode].v.map(v=>v.slice());draw()}else if(k){mode=k;dz=0;V=modes[k].v.map(v=>v.slice());bar();draw()}};
 $('#tg').innerHTML=Object.entries(TN).filter(([k])=>(mode==='thm'?['len','ang','med']:['len','ang','tick','right','diag']).includes(k)).map(([k,n])=>`<button data-t="${k}" class="${T[k]?'on':''}">${n}</button>`).join('');
 $('#tg').onclick=e=>{const k=e.target.dataset.t;if(k){T[k]=T[k]?0:1;bar();draw()}};
 $('#ctl').innerHTML=mode==='thm'?`<div class="c"><h3>Slide the parallel line DE</h3><input id="sl" type="range" min="0.05" max="0.95" step="0.01" value="${t}" style="width:100%"><div class="row"><button data-p="0.5">t = ½ (midpoints)</button><button data-p="0.3333333333">t = ⅓</button><button data-p="0.6666666667">t = ⅔</button><button id="dz">${dz?'■ Stop':'▶ Dance'}</button></div></div>`:'';
 if(mode==='thm'){$('#sl').oninput=e=>{t=+e.target.value;dz=0;$('#dz').textContent='▶ Dance';draw()};
  $('#ctl').onclick=e=>{const q=e.target.dataset.p;if(q){t=+q;dz=0;bar();draw()}else if(e.target.id=='dz'){dz=!dz;if(dz)requestAnimationFrame(dance);bar()}}}}
function dance(ts){if(!dz||mode!=='thm')return;t=.5+.45*Math.sin(ts/1100);const e=$('#sl');if(e)e.value=t;draw();requestAnimationFrame(dance)}
function theme(n){const r=document.documentElement;n=='neon'?r.setAttribute('data-theme','neon'):r.removeAttribute('data-theme');
 try{localStorage.setItem('gbt',n)}catch(e){}$('#th0').className=n=='neon'?'':'on';$('#th1').className=n=='neon'?'on':''}
$('#th0').onclick=()=>theme('classic');$('#th1').onclick=()=>theme('neon');
let tn='classic';try{tn=localStorage.getItem('gbt')||'classic'}catch(e){}
theme(tn);bar();draw();
</script></body></html>
