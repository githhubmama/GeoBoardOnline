<div class="hd"><h1>📐 Geoboard Lab</h1><div class="row"><button id="th0">Classic</button><button id="th1">⚡ Neon</button></div></div>
<p class="sub">Drag corners <b>or sides</b> (pegs snap to whole numbers). Try 🧲 Elastic: pull freely, let go, and see if the shape survives. In a locked mode the shape <b>keeps its rules</b> while you stretch it. Drag the body to move it.</p>
<div class="row" id="modes"></div>
<div class="g"><div><svg id="b"></svg>

<div id="ctl"></div><div id="info"></div></div></div>
<script>
const $=s=>document.querySelector(s);
const N=14,M=10,S=40,P=30,W=N*S+2*P,H=M*S+2*P;
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);

const CR=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
const DT=(o,a,b)=>(a[0]-o[0])*(b[0]-o[0])+(a[1]-o[1])*(b[1]-o[1]);
const PAR=(a,b,c,d)=>(b[0]-a[0])*(d[1]-c[1])-(b[1]-a[1])*(d[0]-c[0])===0;
const f=x=>+x.toFixed(2);
const L=d=>{const r=Math.sqrt(d);return Number.isInteger(r)?''+r:Number.isInteger(d)?'√'+d+' ≈ '+f(r):''+f(r)};
const Ls=d=>{const r=Math.sqrt(d);return Number.isInteger(r)?''+r:Number.isInteger(d)?'√'+d:''+f(r)};
const sl=(a,b)=>{let dx=b[0]-a[0],dy=b[1]-a[1];if(!dx)return'∞';if(!Number.isInteger(dx)||!Number.isInteger(dy))return f(dy/dx);let g=gcd(dx,dy),n=dy/g,d=dx/g;if(d<0){n=-n;d=-d}return d==1?''+n:n+'/'+d};
const rectFrom=(i,o,p)=>{const r=[0,0,0,0];r[i]=p;r[(i+2)%4]=o;
 if(i%2==0){r[(i+1)%4]=[o[0],p[1]];r[(i+3)%4]=[p[0],o[1]]}else{r[(i+1)%4]=[p[0],o[1]];r[(i+3)%4]=[o[0],p[1]]}return r};
const modes={
 free:{n:'Free',v:[[3,3],[10,2],[11,8],[5,7]],t:'No constraints. Move any corner and watch the shape change its name.',d:(i,p)=>V.map((v,k)=>k==i?p:v)},
 rect:{n:'Rectangle',v:[[3,7],[9,7],[9,3],[3,3]],t:'Rule: four 90° angles. Dragging a corner slides its two neighbours along the sides so every angle stays 90°.',d:(i,p)=>rectFrom(i,V[(i+2)%4],p)},
 square:{n:'Square',v:[[4,7],[8,7],[8,3],[4,3]],t:'Rule: 4 equal sides + 4 right angles. The square resizes about the opposite corner.',d:(i,p)=>{const o=V[(i+2)%4],dx=p[0]-o[0],dy=p[1]-o[1],s=Math.max(Math.abs(dx),Math.abs(dy));return rectFrom(i,o,[o[0]+(dx<0?-s:s),o[1]+(dy<0?-s:s)])}},
 para:{n:'Parallelogram',v:[[3,3],[6,7],[11,7],[8,3]],t:'Rule: opposite sides parallel. Moving one corner moves the opposite one too so that A + C = B + D (diagonals keep bisecting each other).',d:(i,p)=>{const r=V.slice(),a=V[(i+1)%4],c=V[(i+3)%4];r[i]=p;r[(i+2)%4]=[a[0]+c[0]-p[0],a[1]+c[1]-p[1]];return r}},
 rhomb:{n:'Rhombus',v:[[7,8],[11,5],[7,2],[3,5]],t:'Rule: diagonals bisect each other at 90°. Dragging a vertex changes the half-length of one diagonal; all 4 sides stay equal.',d:(i,p)=>{const cx=V[0][0],cy=V[1][1],a=i%2?Math.abs(p[0]-cx):V[1][0]-cx,b=i%2?V[0][1]-cy:Math.abs(p[1]-cy);return[[cx,cy+b],[cx+a,cy],[cx,cy-b],[cx-a,cy]]}},
 kite:{n:'Kite',v:[[6,9],[9,6],[6,1],[3,6]],t:'Rule: a vertical axis of symmetry. Top/bottom vertices set the axis; side vertices stay mirror images.',d:(i,p)=>{let x=V[0][0],w=V[1][0]-x,yT=V[0][1],yM=V[1][1],yB=V[2][1];
  if(i==0){x=p[0];yT=p[1]}else if(i==2){x=p[0];yB=p[1]}else{yM=p[1];w=i==1?p[0]-x:x-p[0]}
  return[[x,yT],[x+w,yM],[x,yB],[x-w,yM]]}},
 trap:{n:'Isosceles trapezoid',v:[[5,7],[9,7],[11,3],[3,3]],t:'Rule: top ∥ bottom and equal legs (mirror symmetry). Drag a corner to change width or height; the legs stay equal.',d:(i,p)=>{const cx=(V[0][0]+V[1][0])/2;let a=(V[1][0]-V[0][0])/2,b=(V[2][0]-V[3][0])/2,yT=V[0][1],yB=V[2][1];
  if(i<2)yT=p[1];else yB=p[1];
  if(i==0)a=cx-p[0];if(i==1)a=p[0]-cx;if(i==2)b=p[0]-cx;if(i==3)b=cx-p[0];
  return[[cx-a,yT],[cx+a,yT],[cx+b,yB],[cx-b,yB]]}}
};
modes.thm={n:'△ Triangle theorems',v:[[2,2],[12,2],[5,9]],t:'Triangle lab: drag A, B or C anywhere. D and E sit on AB and AC at the same fraction t. Slide t, or press Dance, and watch what never changes.',d:(i,p)=>V.map((v,k)=>k==i?p:v)};
let t=.5,dz=0,msg=null,anim=0,E=false,cz=0,del=false,hist=[];
const T={len:1,ang:1,tick:1,right:1,diag:0,med:0};
const TN={len:'Side lengths',ang:'Angles',tick:'Equal-side ticks',right:'Right-angle marks',diag:'Diagonals',med:'All 3 midsegments'};
let mode='free',V=modes.free.v.map(v=>v.slice()),drag=null,ch=0;
const chal=[
 ['Build a parallelogram that is NOT a rectangle or rhombus',p=>p.par&&!p.rect&&!p.rhom],
 ['Build a trapezoid (exactly one parallel pair) with area 12',p=>p.trap&&p.area==12],
 ['Build a kite that is NOT a rhombus',p=>p.kite&&p.convex&&!p.rhom],
 ['Build a rhombus with area 10',p=>p.rhom&&p.area==10],
 ['Build a convex quadrilateral with exactly 4 interior pegs (Pick)',p=>p.convex&&p.I==4],
 ['Build a rectangle with perimeter 20 and area 24',p=>p.rect&&p.perim==20&&p.area==24]
];
function an(V){
 const[A,B,C,Dd]=V,s=[D2(A,B),D2(B,C),D2(C,Dd),D2(Dd,A)];
 let a2=0;V.forEach((v,i)=>{const w=V[(i+1)%4];a2+=v[0]*w[1]-w[0]*v[1]});
 const turn=V.map((v,i)=>CR(V[(i+3)%4],v,V[(i+1)%4]));
 const convex=turn.every(t=>t*a2>0);
 const x=(p1,p2,p3,p4)=>CR(p1,p2,p3)*CR(p1,p2,p4)<0&&CR(p3,p4,p1)*CR(p3,p4,p2)<0;
 const simple=!(x(A,B,C,Dd)||x(B,C,Dd,A));
 const p01=PAR(A,B,C,Dd),p12=PAR(B,C,Dd,A),par=p01&&p12;
 const right=V.map((v,i)=>DT(v,V[(i+3)%4],V[(i+1)%4])===0);
 const rect=par&&right[0],rhom=par&&s[0]===s[1],square=rect&&rhom;
 const trap=p01!==p12,isoT=trap&&(p01?s[1]===s[3]:s[0]===s[2]);
 const kite=(s[0]===s[3]&&s[1]===s[2])||(s[0]===s[1]&&s[2]===s[3]);
 const AC=[Dd.length&&C[0]-A[0],C[1]-A[1]],BD=[Dd[0]-B[0],Dd[1]-B[1]];
 const diagBis=A[0]+C[0]===B[0]+Dd[0]&&A[1]+C[1]===B[1]+Dd[1];
 const diagPerp=AC[0]*BD[0]+AC[1]*BD[1]===0,diagEq=D2(A,C)===D2(B,Dd);
 const ang=V.map((v,i)=>{const u=V[(i+3)%4],w=V[(i+1)%4];let a=Math.acos(Math.max(-1,Math.min(1,DT(v,u,w)/(Math.sqrt(D2(v,u)*D2(v,w))||1))))*180/Math.PI;if(turn[i]*a2<0)a=360-a;return a});
 const area=Math.abs(a2)/2;let Bd=0;V.forEach((v,i)=>{const w=V[(i+1)%4];Bd+=gcd(Math.round(w[0]-v[0]),Math.round(w[1]-v[1]))});
 const name=!simple?'Self-intersecting (not a simple quadrilateral)':!convex?'Concave quadrilateral':square?'Square':rect?'Rectangle':rhom?'Rhombus':par?'Parallelogram':isoT?'Isosceles trapezoid':trap&&right.some(q=>q)?'Right trapezoid':trap?'Trapezoid':kite?'Kite':'General quadrilateral';
 return{s,a2,area,convex,simple,p01,p12,par,right,rect,rhom,square,trap,isoT,kite,diagBis,diagPerp,diagEq,ang,Bd,I:area-Bd/2+1,name,perim:s.reduce((q,r)=>q+Math.sqrt(r),0),AC:D2(A,C),BD:D2(B,Dd)}
}
function valid(nv){
 if(nv.some(v=>v[0]<0||v[0]>N||v[1]<0||v[1]>M||!Number.isFinite(v[0])))return false;
 const p=an(nv);if(p.a2===0)return false;
 if(mode!=='free'&&!p.convex)return false;return true}
const px=x=>P+x*S,py=y=>P+(M-y)*S,svg=$('#b');
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
function ptf(e){const r=svg.getBoundingClientRect();return[((e.clientX-r.left)/r.width*W-P)/S,M-((e.clientY-r.top)/r.height*H-P)/S]}
const pt=e=>ptf(e).map(Math.round);
const inB=nv=>nv.every(v=>v[0]>=0&&v[0]<=N&&v[1]>=0&&v[1]<=M);
const eq4=p=>p.s.every(x=>x===p.s[0]),r90=p=>['four 90° angles',p.right.every(x=>x)];
const rules={rect:p=>[r90(p)],square:p=>[r90(p),['all sides equal',eq4(p)]],para:p=>[['opposite sides parallel',p.par]],
 rhomb:p=>[['opposite sides parallel',p.par],['all sides equal',eq4(p)]],kite:p=>[['two pairs of adjacent equal sides',p.kite]],
 trap:p=>[['exactly one pair of parallel sides',p.trap],['equal legs',p.isoT]]};
const hint=()=>({k:'n',t:rules[mode]?'🧲 <b>Elastic test</b>: pull any corner or side wherever you like, then let go. If the shape still obeys its rules it stays; if not, it snaps back like a rubber band.':'🧲 Elastic needs a target figure. Pick Rectangle, Square, Parallelogram, Rhombus, Kite or Trapezoid above.'});
const msgHtml=()=>msg?`<div class="c" style="border-color:${msg.k=='ok'?'var(--ok)':msg.k=='no'?'var(--no)':'var(--line)'}">${msg.t}</div>`:'';
const easeO=k=>1-(1-k)**3,easeE=k=>k<=0?0:k>=1?1:2**(-10*k)*Math.sin((k*10-.75)*2*Math.PI/3)+1;
function tween(a,b,ms,ez){const t0=performance.now();anim=1;(function f(now){const k=Math.min(1,Math.max(0,(now-t0)/ms)),e=ez(k);
 V=a.map((v,i)=>[v[0]+(b[i][0]-v[0])*e,v[1]+(b[i][1]-v[1])*e]);if(k>=1){V=b.map(v=>v.slice());anim=0}draw();if(k<1)requestAnimationFrame(f)})(t0)}
function settle(B){const nv=V.map(v=>[Math.round(v[0]),Math.round(v[1])]),p=an(nv),nm=modes[mode].n.toLowerCase();
 const bad=p.a2===0?['non-zero area']:rules[mode](p).filter(r=>!r[1]).map(r=>r[0]),pass=inB(nv)&&p.a2!==0&&p.convex&&!bad.length;
 msg=pass?{k:'ok',t:`✓ Still a ${nm}: every rule holds, so it <b>stays</b> (it is now a ${p.name}).`}:{k:'no',t:`✗ Not a ${nm} anymore. ${bad.length?'Broken: '+bad.join(' and ')+'. ':''}${p.convex?'':'It is not convex. '}It became a <b>${p.name}</b>, so it snaps back like a rubber band…`};
 tween(V.map(v=>v.slice()),pass?nv:B,pass?260:750,pass?easeO:easeE)}
svg.addEventListener('pointerdown',e=>{if(anim)return;const t=e.target.closest('[data-i]'),g=e.target.closest('[data-g]'),b=V.map(v=>v.slice()),s=ptf(e);
 if(mode==='draw')hist.push(b);if(t&&mode==='draw'&&del){V=V.filter((_,k)=>k!=+t.dataset.i);draw()}else if(t)drag={i:+t.dataset.i,s,b};else if(g)drag={g:+g.dataset.g,s,b};else if(e.target.closest('#poly'))drag={m:1,s,b};else if(mode==='draw'){const q=pt(e);if(inB([q])&&!V.some(v=>v[0]==q[0]&&v[1]==q[1])){V=[...V,q];draw()}}e.preventDefault()});
svg.addEventListener('dblclick',e=>{const t=e.target.closest('[data-i]');if(mode==='draw'&&t&&V.length>3){V=V.filter((_,k)=>k!=+t.dataset.i);draw()}});
addEventListener('pointermove',e=>{if(!drag)return;const c=ptf(e),dx=c[0]-drag.s[0],dy=c[1]-drag.s[1],B=drag.b,n=B.length,EL=E&&rules[mode],rd=x=>EL?x:Math.round(x);let nv;
 if(drag.m)nv=B.map(v=>[v[0]+rd(dx),v[1]+rd(dy)]);
 else if(drag.g!==undefined){const i=drag.g,j=(i+1)%n;
  if(EL||mode==='free'||mode==='thm'||mode==='draw')nv=B.map((v,m)=>m==i||m==j?[v[0]+rd(dx),v[1]+rd(dy)]:v);
  else{const a=B[i],b=B[j],ex=b[0]-a[0],ey=b[1]-a[1],l=Math.hypot(ex,ey)||1,nx=-ey/l,ny=ex/l,d=dx*nx+dy*ny,
   k=Math.hypot(drag.s[0]-a[0],drag.s[1]-a[1])<Math.hypot(drag.s[0]-b[0],drag.s[1]-b[1])?i:j;
   nv=modes[mode].d(k,[Math.round(B[k][0]+nx*d),Math.round(B[k][1]+ny*d)])}}
 else nv=EL?B.map((v,m)=>m==drag.i?c:v):modes[mode].d(drag.i,mode==='circ'?c:c.map(Math.round));
 if(EL){V=nv.map(v=>[Math.min(N,Math.max(0,v[0])),Math.min(M,Math.max(0,v[1]))]);draw();return}
 if(mode==='draw'){if(inB(nv)){V=nv;draw()}return}
 if(mode==='circ'){const r=nv[1][0]-nv[0][0];if(r>=1&&inB([[nv[0][0]-r,nv[0][1]-r],[nv[0][0]+r,nv[0][1]+r]])){V=nv;draw()}return}
 if(mode==='thm'){if(inB(nv)&&CR(nv[0],nv[1],nv[2])){V=nv;draw()}return}
 if(valid(nv)){V=nv;draw()}});
addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;if(mode==='draw'&&d.g!==undefined&&JSON.stringify(V)==JSON.stringify(d.b)){const q=d.s.map(Math.round);if(inB([q])&&!V.some(v=>v[0]==q[0]&&v[1]==q[1])){V=[...V.slice(0,d.g+1),q,...V.slice(d.g+1)];draw()}}if(E&&rules[mode])settle(d.b)});
const unit=(a,b)=>{const d=Math.hypot(b[0]-a[0],b[1]-a[1])||1;return[(b[0]-a[0])/d,(b[1]-a[1])/d]};
function draw(){if(mode==='thm')return drawT();if(mode==='draw')return drawP();if(mode==='circ')return drawC();
 const p=an(V),q=V.map(v=>[px(v[0]),py(v[1])]),cen=[q.reduce((a,v)=>a+v[0],0)/4,q.reduce((a,v)=>a+v[1],0)/4];
 let h='';
 for(let x=0;x<=N;x++)for(let y=0;y<=M;y++)h+=`<circle cx="${px(x)}" cy="${py(y)}" r="3" fill="var(--peg)"/>`;
 for(let x=0;x<=N;x++)h+=`<text x="${px(x)}" y="${H-8}" font-size="10" text-anchor="middle" fill="var(--mut)">${x}</text>`;
 for(let y=0;y<=M;y++)h+=`<text x="10" y="${py(y)+3}" font-size="10" text-anchor="middle" fill="var(--mut)">${y}</text>`;
 h+=`<polygon id="poly" points="${q.map(v=>v.join(',')).join(' ')}" fill="var(--fill)" stroke="var(--acc)" stroke-width="4" stroke-linejoin="round" style="cursor:move"/>`;
 if(T.diag){h+=`<path d="M${q[0]}L${q[2]}M${q[1]}L${q[3]}" stroke="var(--ink)" stroke-dasharray="6 5" stroke-width="1.5" fill="none"/>`;
  const[A,B,C,Dd]=q,d1=[C[0]-A[0],C[1]-A[1]],d2=[Dd[0]-B[0],Dd[1]-B[1]],den=d1[0]*d2[1]-d1[1]*d2[0];

 h+=`<circle id="poly" cx="${qo[0]}" cy="${qo[1]}" r="${r*S}" fill="var(--fill)" stroke="var(--acc)" stroke-width="4" style="cursor:move"/>`;
 h+=ln(qo,qs[0],'var(--mut)',2,1)+ln(qo,qs[1],'var(--mut)',2,1)+ln(qs[2],qs[0],'var(--ok)',3)+ln(qs[2],qs[1],'var(--ok)',3)+ln(qs[0],qs[1],'var(--acc)',3);
 const a3=(a,b,c)=>Math.acos(Math.max(-1,Math.min(1,DT(b,a,c)/(Math.sqrt(D2(b,a)*D2(b,c))||1))))*180/Math.PI;
 const th=a3(X,O,Y),ph=a3(X,Z,Y),dia=Math.abs(th-180)<.5,D=Math.sqrt(D2(X,Y)),major=Math.abs(ph-th/2)<.5;
 h+=VH(qo,0,'O')+VH(Q(Rp),1,'r','var(--ok)');[['X',2],['Y',3],['Z',4]].forEach(([t,i])=>h+=VH(qs[i-2],i,t,i==4?'var(--ok)':null));
 h+=LB(qo[0],qo[1]+28,'θ = '+f(th)+'°','var(--mut)');
 const zc=UV(qs[2],qo);h+=LB(qs[2][0]+zc[0]*34,qs[2][1]+zc[1]*34,'φ = '+f(ph)+'°','var(--ok)');
 svg.innerHTML=h;
 $('#info').innerHTML=`<div class="c"><div class="nm">${dia?"Thales' Semicircle Theorem":'Inscribed Angle Theorem'}</div><p>${dia?'An angle drawn from the two ends of a diameter to any point on the circle is always <b>90°</b>.':'The angle at the centre is <b>twice</b> the angle at the circumference standing on the same arc.'}</p><p class="small">Drag O (centre), r (radius) or X, Y, Z along the circle. Press Orbit Z and watch φ stay put.</p></div>
 <div class="c"><h3>Live</h3><div>Central ∠XOY = θ = <b>${f(th)}°</b></div><div>Inscribed ∠XZY = φ = <b>${f(ph)}°</b></div>
 <div>${major?`<span class="ok">✓</span> φ = θ/2 = ${f(th/2)}° (Z on the major arc)`:`Z is on the minor arc, so φ = 180° − θ/2 = ${f(180-th/2)}°`}</div>
 <div class="small">Chord XY = ${f(D)} = 2r·sin(θ/2) = ${f(2*r*Math.sin(th*Math.PI/360))}</div></div>
 <div class="c"><h3>The circle</h3><div>r = ${r} · diameter = ${2*r}</div><div>Circumference = 2πr = ${f(2*Math.PI*r)}</div><div>Area = πr² = ${f(Math.PI*r*r)}</div><div class="small">Minor arc XY = rθ = ${f(r*th*Math.PI/180)}</div></div>`}
function ctlx(){
 if(mode==='circ')return`<div class="c"><h3>Circle moves</h3><div class="row"><button data-c="dia">XY → diameter (Thales)</button><button data-c="half">θ = 90°</button><button data-c="orb">${cz?'■ Stop':'▶ Orbit Z'}</button></div></div>`;
 if(mode==='draw')return`<div class="c"><h3>Library & edit tools</h3><div class="row">${Object.keys(LIB).map(k=>`<button data-c="L${k}">${k}</button>`).join('')}</div><div class="row"><button data-c="del" class="${del?'on':''}">🗑 Delete mode</button><button data-c="undo">↶ Undo</button><button data-c="clr">Clear all</button></div></div>`;
 return''}
function ctlClick(e){const c=e.target.dataset.c;if(!c)return;
 if(mode==='circ'){const O=V[0],ag=k=>Math.atan2(V[k][1]-O[1],V[k][0]-O[0]),mv=(k,a)=>{V=modes.circ.d(k,[O[0]+Math.cos(a),O[1]+Math.sin(a)])};
  if(c=='dia')mv(3,ag(2)+Math.PI);else if(c=='half')mv(3,ag(2)+Math.PI/2);else if(c=='orb'){cz=!cz;bar();if(cz)requestAnimationFrame(corb);return}draw()}
 else if(mode==='draw'){if(c[0]=='L'){hist.push(V);V=LIB[c.slice(1)].map(v=>v.slice())}else if(c=='clr'){hist.push(V);V=[]}else if(c=='undo')V=hist.pop()||V;else if(c=='del'){del=!del;bar()}draw()}}
function corb(){if(!cz||mode!=='circ')return;const O=V[0],a=Math.atan2(V[4][1]-O[1],V[4][0]-O[0])+.025;V=modes.circ.d(4,[O[0]+Math.cos(a),O[1]+Math.sin(a)]);draw();requestAnimationFrame(corb)}
$('#ctl').addEventListener('click',ctlClick);
function bar(){$('#modes').innerHTML=Object.entries(modes).map(([k,m])=>`<button data-m="${k}" class="${k===mode?'on':''}">${m.n}</button>`).join('')+'<button id="rs">↺ Reset</button><span style="width:14px"></span><button data-e="0" class="'+(E?'':'on')+'">🔒 Locked</button><button data-e="1" class="'+(E?'on':'')+'">🧲 Elastic</button>';
 $('#modes').onclick=e=>{const k=e.target.dataset.m;if(e.target.id=='rs'){V=modes[mode].v.map(v=>v.slice());draw()}else if(e.target.dataset.e){E=e.target.dataset.e=='1';msg=E?hint():null;bar();draw()}else if(k){mode=k;msg=E?hint():null;dz=0;cz=0;del=false;V=modes[k].v.map(v=>v.slice());bar();draw()}};
 $('#tg').innerHTML=Object.entries(TN).filter(([k])=>(mode==='thm'?['len','ang','med']:mode==='draw'||mode==='circ'?['len','ang']:['len','ang','tick','right','diag']).includes(k)).map(([k,n])=>`<button data-t="${k}" class="${T[k]?'on':''}">${n}</button>`).join('');
 $('#tg').onclick=e=>{const k=e.target.dataset.t;if(k){T[k]=T[k]?0:1;bar();draw()}};
 $('#ctl').innerHTML=mode==='thm'?`<div class="c"><h3>Slide the parallel line DE</h3><input id="sl" type="range" min="0.05" max="0.95" step="0.01" value="${t}" style="width:100%"><div class="row"><button data-p="0.5">t = ½ (midpoints)</button><button data-p="0.3333333333">t = ⅓</button><button data-p="0.6666666667">t = ⅔</button><button id="dz">${dz?'■ Stop':'▶ Dance'}</button></div></div>`:ctlx();
 if(mode==='thm'){$('#sl').oninput=e=>{t=+e.target.value;dz=0;$('#dz').textContent='▶ Dance';draw()};
  $('#ctl').onclick=e=>{const q=e.target.dataset.p;if(q){t=+q;dz=0;bar();draw()}else if(e.target.id=='dz'){dz=!dz;if(dz)requestAnimationFrame(dance);bar()}}}}
function dance(ts){if(!dz||mode!=='thm')return;t=.5+.45*Math.sin(ts/1100);const e=$('#sl');if(e)e.value=t;draw();requestAnimationFrame(dance)}
function theme(n){const r=document.documentElement;n=='neon'?r.setAttribute('data-theme','neon'):r.removeAttribute('data-theme');
 try{localStorage.setItem('gbt',n)}catch(e){}$('#th0').className=n=='neon'?'':'on';$('#th1').className=n=='neon'?'on':''}
$('#th0').onclick=()=>theme('classic');$('#th1').onclick=()=>theme('neon');
let tn='classic';try{tn=localStorage.getItem('gbt')||'classic'}catch(e){}
theme(tn);bar();draw();
</script></body></html>
